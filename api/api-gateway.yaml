openapi: 3.0.3
info:
  title: Dialog Helper API Gateway
  version: 0.1.0
x-yc-apigateway:
  service_account_id: "{{SERVICE_ACCOUNT_ID}}"
paths:
  /:
    get:
      x-yc-apigateway-integration:
        type: serverless_containers
        container_id: "{{STORAGE_CONTAINER_ID}}"
        service_account_id: "{{SERVICE_ACCOUNT_ID}}"
        httpMethod: GET
      responses:
        "200":
          description: OK
  /api:
    get:
      x-yc-apigateway-integration:
        type: serverless_containers
        container_id: "{{STORAGE_CONTAINER_ID}}"
        service_account_id: "{{SERVICE_ACCOUNT_ID}}"
        httpMethod: GET
      responses:
        "200":
          description: OK
  /api/:
    get:
      x-yc-apigateway-integration:
        type: serverless_containers
        container_id: "{{STORAGE_CONTAINER_ID}}"
        service_account_id: "{{SERVICE_ACCOUNT_ID}}"
        httpMethod: GET
      responses:
        "200":
          description: OK
  /api/openapi.yaml:
    get:
      x-yc-apigateway-integration:
        type: serverless_containers
        container_id: "{{STORAGE_CONTAINER_ID}}"
        service_account_id: "{{SERVICE_ACCOUNT_ID}}"
        httpMethod: GET
      responses:
        "200":
          description: OK
  /admin:
    get:
      x-yc-apigateway-integration:
        type: serverless_containers
        container_id: "{{STORAGE_CONTAINER_ID}}"
        service_account_id: "{{SERVICE_ACCOUNT_ID}}"
        httpMethod: GET
      responses:
        "200":
          description: OK
  /admin/:
    get:
      x-yc-apigateway-integration:
        type: serverless_containers
        container_id: "{{STORAGE_CONTAINER_ID}}"
        service_account_id: "{{SERVICE_ACCOUNT_ID}}"
        httpMethod: GET
      responses:
        "200":
          description: OK
  /assets/{file}:
    parameters:
      - name: file
        in: path
        required: true
        schema:
          type: string
    get:
      x-yc-apigateway-integration:
        type: serverless_containers
        container_id: "{{STORAGE_CONTAINER_ID}}"
        service_account_id: "{{SERVICE_ACCOUNT_ID}}"
        httpMethod: GET
      responses:
        "200":
          description: OK
  /healthz:
    get:
      x-yc-apigateway-integration:
        type: serverless_containers
        container_id: "{{INFERENCE_CONTAINER_ID}}"
        service_account_id: "{{SERVICE_ACCOUNT_ID}}"
        httpMethod: GET
      responses:
        "200":
          description: OK
  /client.md:
    get:
      x-yc-apigateway-integration:
        type: serverless_containers
        container_id: "{{INFERENCE_CONTAINER_ID}}"
        service_account_id: "{{SERVICE_ACCOUNT_ID}}"
        httpMethod: GET
      responses:
        "200":
          description: OK
  /v1/infer:
    post:
      x-yc-apigateway-integration:
        type: serverless_containers
        container_id: "{{INFERENCE_CONTAINER_ID}}"
        service_account_id: "{{SERVICE_ACCOUNT_ID}}"
        httpMethod: POST
        headers:
          X-API-KEY: "$request.header.X-API-KEY"
      responses:
        "200":
          description: OK
  /v1/admin/keys:
    get:
      x-yc-apigateway-integration:
        type: serverless_containers
        container_id: "{{STORAGE_CONTAINER_ID}}"
        service_account_id: "{{SERVICE_ACCOUNT_ID}}"
        httpMethod: GET
        headers:
          X-ADMIN-KEY: "$request.header.X-ADMIN-KEY"
          X-ADMIN-SESSION: "$request.header.X-ADMIN-SESSION"
      responses:
        "200":
          description: OK
  /v1/admin/keys/{api_key_hash}:
    parameters:
      - name: api_key_hash
        in: path
        required: true
        schema:
          type: string
    delete:
      x-yc-apigateway-integration:
        type: serverless_containers
        container_id: "{{STORAGE_CONTAINER_ID}}"
        service_account_id: "{{SERVICE_ACCOUNT_ID}}"
        httpMethod: DELETE
        headers:
          X-ADMIN-KEY: "$request.header.X-ADMIN-KEY"
          X-ADMIN-SESSION: "$request.header.X-ADMIN-SESSION"
      responses:
        "200":
          description: OK
  /v1/admin/otp/send:
    post:
      x-yc-apigateway-integration:
        type: serverless_containers
        container_id: "{{STORAGE_CONTAINER_ID}}"
        service_account_id: "{{SERVICE_ACCOUNT_ID}}"
        httpMethod: POST
      responses:
        "200":
          description: OK
  /v1/admin/otp/verify:
    post:
      x-yc-apigateway-integration:
        type: serverless_containers
        container_id: "{{STORAGE_CONTAINER_ID}}"
        service_account_id: "{{SERVICE_ACCOUNT_ID}}"
        httpMethod: POST
      responses:
        "200":
          description: OK
  /v1/admin/logs:
    get:
      x-yc-apigateway-integration:
        type: serverless_containers
        container_id: "{{STORAGE_CONTAINER_ID}}"
        service_account_id: "{{SERVICE_ACCOUNT_ID}}"
        httpMethod: GET
        headers:
          X-ADMIN-KEY: "$request.header.X-ADMIN-KEY"
          X-ADMIN-SESSION: "$request.header.X-ADMIN-SESSION"
      responses:
        "200":
          description: OK
  /v1/admin/stats:
    get:
      x-yc-apigateway-integration:
        type: serverless_containers
        container_id: "{{STORAGE_CONTAINER_ID}}"
        service_account_id: "{{SERVICE_ACCOUNT_ID}}"
        httpMethod: GET
        headers:
          X-ADMIN-KEY: "$request.header.X-ADMIN-KEY"
          X-ADMIN-SESSION: "$request.header.X-ADMIN-SESSION"
      responses:
        "200":
          description: OK
    post:
      x-yc-apigateway-integration:
        type: serverless_containers
        container_id: "{{STORAGE_CONTAINER_ID}}"
        service_account_id: "{{SERVICE_ACCOUNT_ID}}"
        httpMethod: POST
        headers:
          X-ADMIN-KEY: "$request.header.X-ADMIN-KEY"
          X-ADMIN-SESSION: "$request.header.X-ADMIN-SESSION"
      responses:
        "200":
          description: OK
  /v1/admin/system-prompt:
    get:
      x-yc-apigateway-integration:
        type: serverless_containers
        container_id: "{{STORAGE_CONTAINER_ID}}"
        service_account_id: "{{SERVICE_ACCOUNT_ID}}"
        httpMethod: GET
        headers:
          X-ADMIN-KEY: "$request.header.X-ADMIN-KEY"
      responses:
        "200":
          description: OK
    post:
      x-yc-apigateway-integration:
        type: serverless_containers
        container_id: "{{STORAGE_CONTAINER_ID}}"
        service_account_id: "{{SERVICE_ACCOUNT_ID}}"
        httpMethod: POST
        headers:
          X-ADMIN-KEY: "$request.header.X-ADMIN-KEY"
      responses:
        "200":
          description: OK
